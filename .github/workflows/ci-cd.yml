name: CCCP Amazon CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "463605761271"

  ECR_CLIENT_REPOSITORY: cccp-amazon-client
  ECR_SERVER_REPOSITORY: cccp-amazon-server

jobs:
  build-test-scan-push:
    name: Build, Test, Security Scan and Deploy
    runs-on: ubuntu-24.04

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================================================
      # AWS AUTHENTICATION
      # ==================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # ==================================================
      # NODE.JS
      # ==================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      # ==================================================
      # FRONTEND CI
      # ==================================================

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Frontend lint
        working-directory: client
        run: npm run lint

      - name: Frontend build
        working-directory: client
        run: npm run build

      # ==================================================
      # BACKEND CI
      # ==================================================

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Backend production dependency audit
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

      # ==================================================
      # DEVSECOPS - SECRET SCANNING
      # ==================================================

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==================================================
      # DOCKER / ECR
      # ==================================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_CLIENT_REPOSITORY }}:${{ github.sha }} \
            -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_CLIENT_REPOSITORY }}:latest \
            ./client

      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_SERVER_REPOSITORY }}:${{ github.sha }} \
            -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_SERVER_REPOSITORY }}:latest \
            ./server

      # ==================================================
      # DEVSECOPS - CONTAINER SECURITY
      # ==================================================

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_CLIENT_REPOSITORY }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_SERVER_REPOSITORY }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library

      # ==================================================
      # PUSH IMAGES TO ECR
      # ==================================================

      - name: Push frontend image
        run: |
          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_CLIENT_REPOSITORY }}:${{ github.sha }}

          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_CLIENT_REPOSITORY }}:latest

      - name: Push backend image
        run: |
          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_SERVER_REPOSITORY }}:${{ github.sha }}

          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_SERVER_REPOSITORY }}:latest

      # ==================================================
      # CD - DEPLOY TO ECS
      # ==================================================

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster CCCP-Amazon-Cluster \
            --service CCCP-Amazon-Frontend-service \
            --force-new-deployment

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster CCCP-Amazon-Cluster \
            --service CCCP-Amazon-Backend-service-qd0nfiny \
            --force-new-deployment

      # ==================================================
      # WAIT FOR DEPLOYMENT
      # ==================================================

      - name: Wait for ECS services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster CCCP-Amazon-Cluster \
            --services \
              CCCP-Amazon-Frontend-service \
              CCCP-Amazon-Backend-service-qd0nfiny

      # ==================================================
      # SUCCESS
      # ==================================================

      - name: Deployment completed
        run: |
          echo "=========================================="
          echo "CI/CD DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=========================================="
          echo "Frontend lint: PASSED"
          echo "Frontend build: PASSED"
          echo "Backend dependency audit: PASSED"
          echo "Gitleaks secret scan: PASSED"
          echo "Docker builds: PASSED"
          echo "Trivy security scans: PASSED"
          echo "Docker images pushed to Amazon ECR"
          echo "Frontend deployed to ECS"
          echo "Backend deployed to ECS"
          echo "ECS services are stable"
          echo "=========================================="