services:
  # ===========================
  # MySQL 8 Database Service
  # ===========================
  mysql:
    image: mysql:8.0
    container_name: cccp_amazon_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # ===========================
  # Backend REST API Service
  # ===========================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: cccp_amazon_server
    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      NODE_ENV: production
      PORT: 5000

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}

      MAX_FILE_SIZE: 5242880
      ALLOWED_FILE_TYPES: image/jpeg,image/png,image/webp

    ports:
      - "5000:5000"

    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs


  # ===========================
  # Frontend React SPA Service
  # ===========================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: cccp_amazon_client
    restart: always

    depends_on:
      server:
        condition: service_started

    ports:
      - "80:80"


# ===========================
# Persistent Volumes
# ===========================
volumes:
  mysql_data:
    name: cccp_amazon_mysql_data

  uploads_data:
    name: cccp_amazon_uploads_data

  logs_data:
    name: cccp_amazon_logs_data