

services:
  # MySQL 8 Database Service
  mysql:
    image: mysql:8.0
    container_name: cccp_amazon_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_production_password_2026
      MYSQL_DATABASE: cccp_amazon
      MYSQL_USER: cccp_admin
      MYSQL_PASSWORD: cccp_secure_db_pass_2026
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot_production_password_2026']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Backend REST API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cccp_amazon_server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: cccp_admin
      DB_PASSWORD: cccp_secure_db_pass_2026
      DB_NAME: cccp_amazon
      JWT_SECRET: cccp_amazon_production_jwt_super_secret_token_key_2026
      JWT_EXPIRES_IN: 24h
      MAX_FILE_SIZE: 5242880
      ALLOWED_FILE_TYPES: image/jpeg,image/png,image/webp
    ports:
      - '5000:5000'
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs

  # Frontend React SPA Service (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cccp_amazon_client
    restart: always
    depends_on:
      - server
    ports:
      - '80:80'

volumes:
  mysql_data:
    name: cccp_amazon_mysql_data
  uploads_data:
    name: cccp_amazon_uploads_data
  logs_data:
    name: cccp_amazon_logs_data
